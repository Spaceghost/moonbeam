---
name: Build Moonbeam - Steam Link
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      linux_runner:
        required: true
        type: string
      ci_version:
        required: true
        type: string

jobs:
  build:
    env:
      CI_VERSION: ${{ inputs.ci_version }}
      MOONBEAM_BUILD_VERSION: ${{ inputs.ci_version }}
    runs-on: ${{ fromJSON(inputs.linux_runner) }}
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Checkout Steam Link SDK
        uses: actions/checkout@v5
        with:
          repository: ValveSoftware/steamlink-sdk
          path: steamlink-sdk
          fetch-depth: 1

      - name: Build binaries
        run: |
          bash scripts/ci-ubuntu.sh bash -c '
            sudo_cmd=(); if [[ $EUID -ne 0 ]]; then sudo_cmd=(sudo); fi
            "${sudo_cmd[@]}" apt-get update -qq
            "${sudo_cmd[@]}" apt-get install -y --no-install-recommends build-essential git ca-certificates curl python3 zip libc6-i386 lib32stdc++6
            export STEAMLINK_SDK_PATH=$PWD/steamlink-sdk
            bash scripts/build-steamlink-app.sh
          '


      - name: Upload Binaries
        uses: actions/upload-artifact@v6
        with:
          name: moonbeam-SteamLink-${{ env.CI_VERSION }}
          path: build/installer-release/Moonbeam-SteamLink-${{ env.CI_VERSION }}.zip
          if-no-files-found: error
