---
name: Build Moonbeam - Windows and macOS
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      native_version:
        required: true
        type: string
      ci_version:
        required: true
        type: string

jobs:
  build:
    env:
      CI_VERSION: ${{ inputs.ci_version }}
      MOONBEAM_BUILD_VERSION: ${{ inputs.ci_version }}
      MOONBEAM_NATIVE_VERSION: ${{ inputs.native_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-2025
            qt_version: 6.12.0
          # macOS
          - os: macos-26
            qt_version: 6.11.2

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Download dependencies (Windows)
        if: runner.os == 'Windows'
        run: powershell ./setup-deps.ps1

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install node
          npm install --global create-dmg

      - name: Install Qt
        id: qt_host
        uses: jurplel/install-qt-action@v4
        with:
          dir: ${{ github.workspace }}/Qt
          cache: true
          set-env: ${{ runner.os != 'Windows' }}
          add-tools-to-path: ${{ runner.os != 'Windows' }}
          tools: ${{ runner.os == 'Windows' && 'tools_qtcreator_gui' || '' }}
          version: ${{ matrix.qt_version }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Install Qt ARM64 (Windows)
        id: qt_arm64
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          dir: ${{ github.workspace }}/Qt
          cache: true
          set-env: false
          add-tools-to-path: false
          arch: win64_msvc2022_arm64_cross_compiled
          version: ${{ matrix.qt_version }}

      - name: Build x64 binaries (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release x64
        env:
          QT_PATH: ${{ steps.qt_host.outputs.qt-root-dir }}\bin

      - name: Build ARM64 binaries (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release arm64
        env:
          QT_PATH: ${{ steps.qt_arm64.outputs.qt-root-dir }}\bin

      - name: Build Package
        shell: pwsh
        run: |
          if ($Env:RUNNER_OS -eq "Windows") {
            cmd /c scripts\generate-bundle.bat Release
          } else {
            bash scripts/generate-dmg.sh Release
          }

      - name: Upload universal Windows installer
        uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: moonbeam-Windows-installer-${{ env.CI_VERSION }}
          path: build/installer-release/MoonbeamSetup-${{ env.CI_VERSION }}.exe
          compression-level: 0
          if-no-files-found: error

      - name: Upload Binaries (Windows x64)
        uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: moonbeam-${{ runner.os }}-x64-${{ env.CI_VERSION }}
          path: build/installer-x64-release/MoonbeamPortable-x64-${{ env.CI_VERSION }}.zip
          if-no-files-found: error

      - name: Upload Binaries (Windows arm64)
        uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: moonbeam-${{ runner.os }}-arm64-${{ env.CI_VERSION }}
          path: build/installer-arm64-release/MoonbeamPortable-arm64-${{ env.CI_VERSION }}.zip
          if-no-files-found: error

      - name: Upload Binaries (macOS)
        uses: actions/upload-artifact@v6
        if: runner.os == 'macOS'
        with:
          name: moonbeam-${{ runner.os }}-${{ env.CI_VERSION }}
          path: build/installer-Release/*.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Upload Symbols
        uses: actions/upload-artifact@v6
        with:
          name: moonbeam-symbols-${{ runner.os }}-${{ env.CI_VERSION }}
          path: |
            build/installer-*/*.dsym/**
            build/symbols-*/*.pdb
          if-no-files-found: error
