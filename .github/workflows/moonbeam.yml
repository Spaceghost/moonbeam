name: Moonbeam checks

on:
  push:
  workflow_dispatch:
    inputs:
      runner:
        description: Linux capacity (github bypasses an unavailable local pool)
        type: choice
        options: [auto, github, self-hosted]
        default: auto

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workers:
    uses: ./.github/workflows/select-runner.yml
    with:
      runner: ${{ inputs.runner || 'auto' }}
  tests:
    needs: workers
    runs-on: ${{ fromJSON(needs.workers.outputs.linux) }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Run installer, release, reconnect and profile checks on Ubuntu 22.04
        run: bash scripts/ci-ubuntu.sh bash scripts/ci-checks.sh
