name: Moonbeam release candidate

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      native_version: ${{ steps.version.outputs.native_version }}
    steps:
      - uses: actions/checkout@v5
      - name: Derive release versions
        id: version
        run: python3 scripts/release-version.py >> "$GITHUB_OUTPUT"

  windows-macos:
    needs: setup
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ needs.setup.outputs.version }}
      native_version: ${{ needs.setup.outputs.native_version }}

  steamlink:
    needs: setup
    uses: ./.github/workflows/build-steamlink.yml
    with:
      ci_version: ${{ needs.setup.outputs.version }}

  build:
    needs: setup
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Installer checks
        run: |
          python3 tests/test_installer.py
          python3 tests/test_release_promotion.py
          python3 tests/test_release_artifacts.py
      - name: Build and test candidate
        run: |
          MOONBEAM_BUILD_VERSION="$(cat app/moonbeam-version.txt)+g${GITHUB_SHA:0:12}"
          export MOONBEAM_BUILD_VERSION
          bash scripts/build-moonbeam-linux.sh
      - name: Verify portable startup and artifact checksums
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # GPU and desktop libraries intentionally come from the target host.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libva-wayland2 libva-x11-2 libegl1 libgl1 libopengl0 libvulkan1 libx11-6 \
            libwayland-client0 libdrm2 libfontconfig1 libglib2.0-0 \
            libharfbuzz0b libfreetype6
          version="$(cat app/moonbeam-version.txt)+g${GITHUB_SHA:0:12}"
          "dist/Moonbeam-$version-x86_64.AppImage" --appimage-extract-and-run --version
          python3 scripts/release-artifacts.py "$version"
          cd dist
          sha256sum -c Moonbeam-SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: moonbeam-linux-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/Moonbeam-SHA256SUMS
            dist/candidate.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  assemble:
    needs: [setup, build, windows-macos, steamlink]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/download-artifact@v7
        with:
          pattern: moonbeam-*
          path: incoming
      - name: Assemble complete release and verify checksums
        env:
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          mkdir -p dist
          find incoming -type f \( -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \) ! -name '*DebuggingSymbols*' -exec cp -t dist -- {} +
          python3 scripts/release-artifacts.py "$RELEASE_VERSION" --complete
          cd dist
          sha256sum -c Moonbeam-SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: moonbeam-candidate-${{ github.sha }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
