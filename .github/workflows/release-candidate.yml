name: Moonbeam release candidate

on:
  push:
    branches: [master, 'release/**']
  workflow_dispatch:
    inputs:
      runner:
        description: Linux capacity (github bypasses an unavailable local pool)
        type: choice
        options: [auto, github, self-hosted]
        default: auto
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workers:
    uses: ./.github/workflows/select-runner.yml
    with:
      runner: ${{ inputs.runner || 'auto' }}
  setup:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      native_version: ${{ steps.version.outputs.native_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify matching published Moonlight release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-upstream-release.py
      - name: Derive release versions
        id: version
        run: python3 scripts/release-version.py >> "$GITHUB_OUTPUT"

  windows-macos:
    needs: setup
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ needs.setup.outputs.version }}
      native_version: ${{ needs.setup.outputs.native_version }}

  steamlink:
    needs: [setup, workers]
    uses: ./.github/workflows/build-steamlink.yml
    with:
      linux_runner: ${{ needs.workers.outputs.linux }}
      ci_version: ${{ needs.setup.outputs.version }}

  build:
    needs: setup
    # Portable packages must retain Ubuntu 22.04/glibc 2.35 compatibility.
    # The admitted self-hosted software image is Ubuntu 24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: |
            build/deps/*.AppImage
            build/deps/*.tar.gz
          key: linux-dependency-downloads-${{ hashFiles('scripts/prepare-moonbeam-sdk.py') }}
      - name: Build, test and verify Linux packages on Ubuntu 22.04
        env:
          MOONBEAM_BUILD_VERSION: ${{ needs.setup.outputs.version }}
        run: bash scripts/ci-ubuntu.sh bash scripts/ci-build-linux.sh
      - uses: actions/upload-artifact@v6
        with:
          name: moonbeam-linux-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/Moonbeam-SHA256SUMS
            dist/candidate.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  assemble:
    needs: [setup, workers, build, windows-macos, steamlink]
    runs-on: ${{ fromJSON(needs.workers.outputs.linux) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: moonbeam-*
          path: incoming
      - name: Assemble complete release and verify checksums
        env:
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          mkdir -p dist
          find incoming -type f \( -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \) ! -name '*DebuggingSymbols*' -exec cp -t dist -- {} +
          python3 scripts/release-artifacts.py "$RELEASE_VERSION" --complete
          cd dist
          sha256sum -c Moonbeam-SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: moonbeam-candidate-${{ github.sha }}
          path: dist/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Write build summary
        env:
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          {
            echo "## Moonbeam $RELEASE_VERSION packages rebuilt"
            echo 'Windows x64/ARM64, macOS universal, Linux AppImage/installer, Steam Link and complete source.'
            echo "Source: $GITHUB_SHA"
            echo "Download: moonbeam-candidate-$GITHUB_SHA (Artifacts above)."
            echo 'Promotion requires decoder recreation and live stream validation of these exact bytes.'
          } >> "$GITHUB_STEP_SUMMARY"
